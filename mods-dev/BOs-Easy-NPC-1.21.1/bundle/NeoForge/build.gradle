plugins {
  id 'maven-publish'
  id 'net.neoforged.moddev'
  id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
  id 'nu.studer.credentials' version '3.0' apply false
  id 'com.modrinth.minotaur' version '2.+' apply false
}

base {
  archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

def distributionPublishingEnabled = providers.gradleProperty('enable_distribution_publishing')
    .map { it.toBoolean() }
    .orElse(false)
    .get()

repositories {
  mavenLocal()
  mavenCentral()
}

sourceSets {
  main {
    resources {
      srcDir '../Common/src/main/resources'
    }
  }
}

neoForge {
  version = project.neoforge_version

  runs {
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      systemProperty 'forge.logging.console.level', 'debug'
      logLevel = org.slf4j.event.Level.DEBUG
    }

    client {
      client()
    }

    server {
      server()
      programArgument '--nogui'
    }
  }

  mods {
    "${project.mod_id}" {
      sourceSet sourceSets.main
    }
  }
}

dependencies {
  // The bundle contains dependency metadata only; modules remain separate playable jars.
  runtimeOnly group: 'de.markusbordihn.easynpc',
      name: "easy_npc-neoforge-${project.minecraft_version}",
      version: "${project.version}"
  runtimeOnly group: 'de.markusbordihn.easynpc.configui',
      name: "easy_npc_config_ui-neoforge-${project.minecraft_version}",
      version: "${project.version}"
}

def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (!versionParts.isEmpty()) {
    return "${versionParts[0].toInteger() + 1}.0.0"
  }
  return '1.0.0'
}

tasks.named('processResources', ProcessResources).configure {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  def nextMajor = getNextMajorVersion(project.version.toString())
  inputs.property 'version', project.version
  inputs.property 'nextMajorVersion', nextMajor

  filesMatching(['META-INF/neoforge.mods.toml']) {
    expand 'file': [
        'jarVersion'      : project.version,
        'nextMajorVersion': nextMajor
    ]
  }
}

tasks.named('compileTestJava', JavaCompile).configure {
  enabled = !sourceSets.test.allSource.isEmpty()
}

tasks.named('jar', Jar).configure {
  manifest {
    attributes([
        'Specification-Title'      : project.mod_name,
        'Specification-Vendor'     : project.mod_author,
        'Specification-Version'    : project.version,
        'Implementation-Title'     : project.mod_name,
        'Implementation-Version'   : project.version,
        'Implementation-Vendor'    : project.mod_author,
        'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
  }
}

if (distributionPublishingEnabled) {
  apply plugin: 'com.matthewprenger.cursegradle'
  apply plugin: 'nu.studer.credentials'
  apply plugin: 'com.modrinth.minotaur'

  if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
    curseforge {
      apiKey = "${credentials.forKey('curseforge_api_token')}"
      project {
        id = "${project.curseforge_project_id}"
        changelog = rootProject.file('../CHANGELOG.md')
        changelogType = 'markdown'
        releaseType = "${project.curseforge_release_type}"
        addGameVersion("${project.minecraft_version}")
        addGameVersion('NeoForge')
        mainArtifact(jar) {
          relations {
            requiredDependency 'easy-npc-core'
            requiredDependency 'easy-npc-config-ui'
          }
        }
      }
    }
  }

  if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
    modrinth {
      token = "${credentials.forKey('modrinth_api_token')}"
      projectId = "${project.modrinth_project_id}"
      versionNumber = "${project.version}"
      versionType = "${project.modrinth_release_type}"
      versionName = "${project.mod_name} ${project.version}"
      changelog = rootProject.file('../CHANGELOG.md').text
      uploadFile = tasks.jar
      gameVersions = ["${project.minecraft_version}"]
      loaders = ['neoforge']
      dependencies {
        required.project 'easy-npc-core'
        required.project 'easy-npc-config-ui'
      }
    }
  }
}
