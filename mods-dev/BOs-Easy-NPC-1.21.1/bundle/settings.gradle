pluginManagement {
  repositories {
    gradlePluginPortal()
    maven {
      name = 'Fabric'
      url = 'https://maven.fabricmc.net/'
    }
    maven {
      name = 'NeoForge'
      url = 'https://maven.neoforged.net/releases/'
    }
    maven {
      name = 'Forge'
      url = 'https://maven.minecraftforge.net/'
    }
    maven {
      name = 'Sponge Snapshots'
      url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
  }

  plugins {
    id 'fabric-loom' version "${fabric_loom}"
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
  }
}

rootProject.name = 'bundle'

// Configure only the requested loader project when a loader-qualified task is used. This keeps
// independent loader toolchains and unpublished artifacts from blocking one another.
def loaderProjects = ['Fabric', 'Forge', 'NeoForge']
def requestedLoaderProjects = loaderProjects.findAll { loader ->
  gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.startsWith(':') ? taskName.substring(1) : taskName
    normalizedTaskName == loader || normalizedTaskName.startsWith("${loader}:")
  }
}

include('Common')
(requestedLoaderProjects ?: loaderProjects).each { include(it) }
