plugins {
  id 'maven-publish'
  id 'net.neoforged.gradle.userdev' version '7.0.190'
  id 'com.matthewprenger.cursegradle' version '1.4.0'
  id 'nu.studer.credentials' version '3.0'
  id "com.modrinth.minotaur" version "2.+"
}

base {
  archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
  configureEach {
    systemProperty 'forge.logging.markers', 'REGISTRIES'
    systemProperty 'forge.logging.console.level', 'debug'
    modSource project.sourceSets.main
  }

  client {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
  }

  client2 {
    runType('client')
    workingDirectory project.file('runs/client2')
    arguments.addAll '--username', 'guest_player'
  }

  server {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    arguments.add '--nogui'
  }

  gameTestServer {
    systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
  }

  data {
    arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
  }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def commonProject = project(":Common")
def sharedClientSources = fileTree(dir: "../Client/src/main/java", include: "**/*.java")

dependencies {
  implementation "net.neoforged:neoforge:${project.neoforge_version}"

  // Loader-neutral domain code is compiled into the NeoForge artifact.
  implementation commonProject

  // Test dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Additional helpful Mods for development (runtime dependency)
  if (project.hasProperty('neoforge_jei_mod') && project.neoforge_jei_mod) {
    runtimeOnly "curse.maven:jei-238222:${project.neoforge_jei_mod}"
  }
  if (project.hasProperty('neoforge_xaeros_minimap_mod') && project.neoforge_xaeros_minimap_mod) {
    runtimeOnly "curse.maven:xaeros_minimap-263420:${project.neoforge_xaeros_minimap_mod}"
  }

  // Test dependencies
  // runtimeOnly "curse.maven:epic-fight-mod-405076:7185834"
}

// NeoGradle compiles the game, but common and shared-client code belong to this mod's compilation.
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
  source(commonProject.sourceSets.main.allSource)
  source(sharedClientSources)
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
  source(commonProject.sourceSets.main.allJava)
  source(sharedClientSources)
}

tasks.named('sourcesJar', Jar).configure {
  from commonProject.sourceSets.main.allSource
  from sharedClientSources
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(ProcessResources).matching(notNeoTask).configureEach {
  from commonProject.sourceSets.main.resources
}

def requiredSharedClientClasses = [
    'de/markusbordihn/easynpc/client/SpawnTimerData.class',
    'de/markusbordihn/easynpc/client/screen/QuestDialogScreen.class',
    'de/markusbordihn/easynpc/client/screen/SpawnTimerScreen.class'
]

def jarTask = tasks.named('jar', Jar)
def verifySharedClientPackaging = tasks.register('verifySharedClientPackaging') {
  group = 'verification'
  description = 'Verifies that shared client screens are packaged in the NeoForge core jar.'
  dependsOn jarTask

  doLast {
    def archiveFile = jarTask.get().archiveFile.get().asFile
    def archiveTree = zipTree(archiveFile)
    def missingEntries = requiredSharedClientClasses.findAll { entry ->
      archiveTree.matching { include entry }.isEmpty()
    }

    if (!missingEntries.isEmpty()) {
      throw new GradleException(
          "NeoForge jar is missing shared client classes: ${missingEntries.join(', ')}")
    }
  }
}

tasks.named('check') {
  dependsOn verifySharedClientPackaging
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId project.archivesBaseName
      version project.version
      artifact jar
    }
  }
}

tasks.named('build') {
  finalizedBy 'publishToMavenLocal'
}

test {
  exclude '**/mixin/**'
}

// CurseForge Publishing
if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
  curseforge {
    apiKey = "${credentials.forKey('curseforge_api_token')}"
    project {
      id = "${project.curseforge_project_id}"
      changelog = rootProject.file("../CHANGELOG.md")
      changelogType = 'markdown'
      releaseType = "${project.curseforge_release_type}"
      addGameVersion("${project.minecraft_version}")
      addGameVersion("NeoForge")
      mainArtifact(jar) {
        relations {
          optionalDependency 'armourers-workshop'
        }
      }
    }
  }
}

// Modrinth Publishing
if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
  modrinth {
    token = "${credentials.forKey('modrinth_api_token')}"
    projectId = "${project.modrinth_project_id}"
    versionNumber = "${project.version}"
    versionType = "${project.modrinth_release_type}"
    versionName = "${project.mod_name} ${project.version}"
    changelog = rootProject.file("../CHANGELOG.md").text
    uploadFile = jar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ["neoforge"]
    dependencies {
      optional.project "armourers-workshop"
    }
  }
}
