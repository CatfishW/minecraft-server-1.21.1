plugins {
  id 'maven-publish'
  id 'net.neoforged.moddev'
  id 'com.matthewprenger.cursegradle' version '1.4.0' apply false
  id 'nu.studer.credentials' version '3.0' apply false
  id 'com.modrinth.minotaur' version '2.+' apply false
}

base {
  archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

def commonProject = project(':Common')

def distributionPublishingEnabled = providers.gradleProperty('enable_distribution_publishing')
    .map { it.toBoolean() }
    .orElse(false)
    .get()

sourceSets {
  main {
    java {
      srcDir commonProject.file('src/main/java')
    }
    resources {
      srcDir commonProject.file('src/main/resources')
      srcDir 'src/generated/resources'
    }
  }
}

neoForge {
  version = project.neoforge_version
  validateAccessTransformers = true

  runs {
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      systemProperty 'forge.logging.console.level', 'debug'
      logLevel = org.slf4j.event.Level.DEBUG
    }

    client {
      client()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    client2 {
      client()
      gameDirectory = project.file('runs/client2')
      programArguments.addAll '--username', 'guest_player'
    }

    server {
      server()
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      programArgument '--nogui'
    }

    gameTestServer {
      type = 'gameTestServer'
      systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
      data()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output',
          file('src/generated/resources/').getAbsolutePath(), '--existing',
          file('src/main/resources/').getAbsolutePath()
    }
  }

  mods {
    "${project.mod_id}" {
      sourceSet sourceSets.main
    }
  }
}

dependencies {
  // Core is an independently published module and must be available in development runs.
  implementation "de.markusbordihn.easynpc:easy_npc-neoforge-${project.minecraft_version}:${project.version}"

  // JUnit 5 for unit testing.
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.1'

  // Optional development-only mods.
  if (project.hasProperty('neoforge_jei_mod') && project.neoforge_jei_mod) {
    runtimeOnly "curse.maven:jei-238222:${project.neoforge_jei_mod}"
  }
  if (project.hasProperty('neoforge_xaeros_minimap_mod') && project.neoforge_xaeros_minimap_mod) {
    runtimeOnly "curse.maven:xaeros_minimap-263420:${project.neoforge_xaeros_minimap_mod}"
  }
}

def getNextMajorVersion(String currentVersion) {
  def versionParts = currentVersion.tokenize('.')
  if (!versionParts.isEmpty()) {
    return "${versionParts[0].toInteger() + 1}.0.0"
  }
  return '1.0.0'
}

tasks.named('processResources', ProcessResources).configure {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  def nextMajor = getNextMajorVersion(project.version.toString())
  inputs.property 'version', project.version
  inputs.property 'nextMajorVersion', nextMajor

  filesMatching(['META-INF/neoforge.mods.toml']) {
    expand 'file': [
        'jarVersion'      : project.version,
        'nextMajorVersion': nextMajor
    ]
  }
}

idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId project.group
      artifactId base.archivesName.get()
      version project.version
      from components.java
    }
  }
}

tasks.named('build') {
  finalizedBy tasks.named('publishToMavenLocal')
}

test {
  useJUnitPlatform()
}

if (distributionPublishingEnabled) {
  apply plugin: 'com.matthewprenger.cursegradle'
  apply plugin: 'nu.studer.credentials'
  apply plugin: 'com.modrinth.minotaur'

  if (project.hasProperty('curseforge_project_id') && project.curseforge_project_id) {
    curseforge {
      apiKey = "${credentials.forKey('curseforge_api_token')}"
      project {
        id = "${project.curseforge_project_id}"
        changelog = rootProject.file("../CHANGELOG.md")
        changelogType = 'markdown'
        releaseType = "${project.curseforge_release_type}"
        addGameVersion("${project.minecraft_version}")
        addGameVersion('NeoForge')
        mainArtifact(jar) {
          relations {
            requiredDependency 'easy-npc-core'
          }
        }
      }
    }
  }

  if (project.hasProperty('modrinth_project_id') && project.modrinth_project_id) {
    modrinth {
      token = "${credentials.forKey('modrinth_api_token')}"
      projectId = "${project.modrinth_project_id}"
      versionNumber = "${project.version}"
      versionType = "${project.modrinth_release_type}"
      versionName = "${project.mod_name} ${project.version}"
      changelog = rootProject.file("../CHANGELOG.md").text
      uploadFile = jar
      gameVersions = ["${project.minecraft_version}"]
      loaders = ['neoforge']
      dependencies {
        required.project 'easy-npc-core'
      }
    }
  }
}
