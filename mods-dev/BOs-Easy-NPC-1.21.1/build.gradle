plugins {
  id 'base'
}

/*
 * This repository contains three independent Gradle builds. Keep orchestration here and keep
 * loader-specific implementation inside each module's NeoForge project.
 *
 * A GradleBuild directory may only be included once in a single task graph. Build-only and
 * verification pipelines therefore use separate, self-contained nested invocations per module.
 */
def registerNestedBuild = {
  String taskName,
  String moduleDirectory,
  List<String> requestedTasks,
  String taskDescription ->
    tasks.register(taskName, GradleBuild) {
      group = 'NeoForge'
      description = taskDescription
      dir = file(moduleDirectory)
      tasks = requestedTasks
    }
}

def cleanCore = registerNestedBuild(
    'cleanNeoForgeCore',
    'core',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Core NeoForge project.')

def cleanConfigUi = registerNestedBuild(
    'cleanNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Config UI NeoForge project.')

def cleanBundle = registerNestedBuild(
    'cleanNeoForgeBundle',
    'bundle',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Bundle NeoForge project.')

// Build-only pipeline: one nested invocation per independent build.
def buildCore = registerNestedBuild(
    'buildNeoForgeCore',
    'core',
    [':NeoForge:build'],
    'Builds and publishes Easy NPC Core for NeoForge to Maven Local.')

def buildConfigUi = registerNestedBuild(
    'buildNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:build'],
    'Builds and publishes Easy NPC Config UI for NeoForge to Maven Local.')

def buildBundle = registerNestedBuild(
    'buildNeoForgeBundle',
    'bundle',
    [':NeoForge:build'],
    'Builds the Easy NPC dependency bundle for NeoForge.')

buildConfigUi.configure {
  dependsOn buildCore
}

buildBundle.configure {
  dependsOn buildConfigUi
}

// Verification pipeline: build and GameTest each module inside one nested invocation. This avoids
// Gradle's duplicate included-build path error while retaining Maven Local as the narrow hand-off.
def verifyCore = registerNestedBuild(
    'verifyNeoForgeCore',
    'core',
    [':NeoForge:build', ':NeoForge:runGameTestServer'],
    'Builds Easy NPC Core and runs its NeoForge dedicated-server GameTests.')

def verifyConfigUi = registerNestedBuild(
    'verifyNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:build', ':NeoForge:runGameTestServer'],
    'Builds Easy NPC Config UI and runs its NeoForge dedicated-server GameTests.')

def verifyBundle = registerNestedBuild(
    'verifyNeoForgeBundle',
    'bundle',
    [':NeoForge:build'],
    'Builds the Easy NPC dependency bundle after all NeoForge GameTests pass.')

verifyConfigUi.configure {
  dependsOn verifyCore
}

verifyBundle.configure {
  dependsOn verifyConfigUi
}

tasks.register('cleanNeoForge') {
  group = 'NeoForge'
  description = 'Cleans every NeoForge module.'
  dependsOn cleanCore, cleanConfigUi, cleanBundle
}

tasks.register('buildNeoForge') {
  group = 'NeoForge'
  description = 'Builds Core, Config UI, and Bundle for NeoForge 1.21.1 in dependency order.'
  dependsOn buildBundle
}

tasks.register('gameTestNeoForge') {
  group = 'verification'
  description = 'Builds Core and Config UI and runs their NeoForge dedicated-server GameTests.'
  dependsOn verifyConfigUi
}

tasks.register('verifyNeoForge') {
  group = 'verification'
  description = 'Builds all NeoForge jars and runs dedicated-server GameTests.'
  dependsOn verifyBundle
}

tasks.named('clean') {
  dependsOn 'cleanNeoForge'
}

tasks.named('build') {
  dependsOn 'buildNeoForge'
}
