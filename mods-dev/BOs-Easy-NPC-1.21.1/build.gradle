plugins {
  id 'base'
}

/*
 * This repository contains three independent Gradle builds. Keep orchestration here and keep
 * loader-specific implementation inside each module's NeoForge project.
 */
def registerNestedBuild = {
  String taskName,
  String moduleDirectory,
  List<String> requestedTasks,
  String taskDescription ->
    tasks.register(taskName, GradleBuild) {
      group = 'NeoForge'
      description = taskDescription
      dir = file(moduleDirectory)
      tasks = requestedTasks
    }
}

def cleanCore = registerNestedBuild(
    'cleanNeoForgeCore',
    'core',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Core NeoForge project.')

def cleanConfigUi = registerNestedBuild(
    'cleanNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Config UI NeoForge project.')

def cleanBundle = registerNestedBuild(
    'cleanNeoForgeBundle',
    'bundle',
    [':NeoForge:clean'],
    'Cleans the Easy NPC Bundle NeoForge project.')

def buildCore = registerNestedBuild(
    'buildNeoForgeCore',
    'core',
    [':NeoForge:build'],
    'Builds and publishes Easy NPC Core for NeoForge to Maven Local.')

def gameTestCore = registerNestedBuild(
    'gameTestNeoForgeCore',
    'core',
    [':NeoForge:runGameTestServer'],
    'Runs the Easy NPC Core NeoForge server GameTests.')

def buildConfigUi = registerNestedBuild(
    'buildNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:build'],
    'Builds and publishes Easy NPC Config UI for NeoForge to Maven Local.')

def gameTestConfigUi = registerNestedBuild(
    'gameTestNeoForgeConfigUi',
    'config-ui',
    [':NeoForge:runGameTestServer'],
    'Runs the Easy NPC Config UI NeoForge server GameTests.')

def buildBundle = registerNestedBuild(
    'buildNeoForgeBundle',
    'bundle',
    [':NeoForge:build'],
    'Builds the Easy NPC dependency bundle for NeoForge.')

// Maven Local is the intentionally narrow hand-off between the independent module builds.
gameTestCore.configure {
  dependsOn buildCore
}

buildConfigUi.configure {
  dependsOn buildCore
  mustRunAfter gameTestCore
}

gameTestConfigUi.configure {
  dependsOn gameTestCore, buildConfigUi
}

buildBundle.configure {
  dependsOn buildConfigUi
  mustRunAfter gameTestConfigUi
}

tasks.register('cleanNeoForge') {
  group = 'NeoForge'
  description = 'Cleans every NeoForge module.'
  dependsOn cleanCore, cleanConfigUi, cleanBundle
}

tasks.register('buildNeoForge') {
  group = 'NeoForge'
  description = 'Builds Core, Config UI, and Bundle for NeoForge 1.21.1 in dependency order.'
  dependsOn buildBundle
}

tasks.register('gameTestNeoForge') {
  group = 'verification'
  description = 'Runs the Core and Config UI NeoForge dedicated-server GameTests.'
  dependsOn gameTestConfigUi
}

tasks.register('verifyNeoForge') {
  group = 'verification'
  description = 'Builds all NeoForge jars and runs dedicated-server GameTests.'
  dependsOn gameTestConfigUi, buildBundle
}

tasks.named('clean') {
  dependsOn 'cleanNeoForge'
}

tasks.named('build') {
  dependsOn 'buildNeoForge'
}
