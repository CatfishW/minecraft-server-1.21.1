name: Easy NPC NeoForge 1.21.1

on:
  push:
    branches:
      - codex/easy-npc-neoforge-1.21.1
    paths:
      - 'mods-dev/BOs-Easy-NPC-1.21.1/**'
      - '.github/workflows/easy-npc-neoforge-1.21.1.yml'
  pull_request:
    paths:
      - 'mods-dev/BOs-Easy-NPC-1.21.1/**'
      - '.github/workflows/easy-npc-neoforge-1.21.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easy-npc-neoforge-${{ github.ref }}
  cancel-in-progress: true

env:
  MOD_DIR: mods-dev/BOs-Easy-NPC-1.21.1
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

jobs:
  verify:
    name: NeoForge build and dedicated-server GameTests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Easy NPC sources only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mods-dev/BOs-Easy-NPC-1.21.1
          sparse-checkout-cone-mode: true
          submodules: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Verify toolchain
        working-directory: ${{ env.MOD_DIR }}
        run: |
          java -version
          gradle --version

      - name: Build all NeoForge modules and run server GameTests
        working-directory: ${{ env.MOD_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci
          gradle verifyNeoForge --no-daemon --stacktrace --warning-mode all 2>&1 \
            | tee build/ci/verify-neoforge.log

      - name: Upload playable Core jar
        uses: actions/upload-artifact@v4
        with:
          name: easy-npc-core-neoforge-1.21.1
          path: |
            ${{ env.MOD_DIR }}/core/NeoForge/build/libs/*.jar
            !${{ env.MOD_DIR }}/core/NeoForge/build/libs/*-sources.jar
            !${{ env.MOD_DIR }}/core/NeoForge/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload playable Config UI jar
        uses: actions/upload-artifact@v4
        with:
          name: easy-npc-config-ui-neoforge-1.21.1
          path: |
            ${{ env.MOD_DIR }}/config-ui/NeoForge/build/libs/*.jar
            !${{ env.MOD_DIR }}/config-ui/NeoForge/build/libs/*-sources.jar
            !${{ env.MOD_DIR }}/config-ui/NeoForge/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload playable Bundle jar
        uses: actions/upload-artifact@v4
        with:
          name: easy-npc-bundle-neoforge-1.21.1
          path: |
            ${{ env.MOD_DIR }}/bundle/NeoForge/build/libs/*.jar
            !${{ env.MOD_DIR }}/bundle/NeoForge/build/libs/*-sources.jar
            !${{ env.MOD_DIR }}/bundle/NeoForge/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easy-npc-neoforge-diagnostics
          path: |
            ${{ env.MOD_DIR }}/build/ci/verify-neoforge.log
            ${{ env.MOD_DIR }}/**/build/reports/**
            ${{ env.MOD_DIR }}/**/runs/**/logs/**
            ${{ env.MOD_DIR }}/**/run/**/logs/**
          if-no-files-found: error
          retention-days: 14
