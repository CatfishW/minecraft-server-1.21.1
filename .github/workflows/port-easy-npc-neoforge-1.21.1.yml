name: Port Easy NPC to NeoForge 1.21.1

on:
  push:
    branches:
      - codex/neoforge-1.21.1-easy-npc-remote
    paths:
      - tools/port-easy-npc-neoforge-1.21.1.sh
      - .github/workflows/port-easy-npc-neoforge-1.21.1.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4G

jobs:
  generate-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[generated-port]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out port branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Generate, build, and commit NeoForge source
        run: ./tools/port-easy-npc-neoforge-1.21.1.sh

      - name: Upload verification logs and distributable JARs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easy-npc-neoforge-1.21.1-verification
          path: |
            ${{ runner.temp }}/easy-npc-neoforge-port/status/**
            ${{ runner.temp }}/easy-npc-neoforge-port/candidate/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
